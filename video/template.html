<meta charset="utf-8">
<title>Thai Token Retrofit Film</title>
<meta name="description" content="An animated how-it-works explainer of the Thai tokenizer retrofit, built from the project's real tokenizers, merges and embeddings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root { color-scheme: dark; --bg: #07090a; --panel: #121513; --ink: #f1f3ef; --muted: #8d9189; --rule: #2b2e2a; --accent: #3987e5; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 "IBM Plex Sans Thai", system-ui, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: grid; gap: 12px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
button { font: 600 13px/1 "IBM Plex Mono", monospace; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 14px; cursor: pointer; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { flex: 1 1 240px; accent-color: var(--accent); }
.time { font: 500 13px/1 "IBM Plex Mono", monospace; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
.scenes { display: flex; flex-wrap: wrap; gap: 6px; }
.scenes button { font: 500 12px/1.2 "IBM Plex Sans Thai", sans-serif; padding: 6px 9px; color: var(--muted); }
.scenes button.on { color: var(--ink); border-color: var(--accent); }
body.capture .wrap { max-width: none; padding: 0; }
body.capture .bar, body.capture .scenes { display: none; }
body.capture .stage { border-radius: 0; }
.stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; background: #000; }
.stage:fullscreen canvas { object-fit: contain; cursor: pointer; }
.scenes .act { font: 600 11px/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 100%; margin-top: 6px; }
</style>

<div class="wrap">
  <div class="stage"><canvas id="c" width="1920" height="1080" aria-label="Animated explainer of how the Thai tokenizer retrofit works"></canvas></div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button" title="Full screen (F)">Full screen</button>
    <audio id="snd" src="soundtrack.mp3" preload="auto"></audio>
  </div>
  <div class="scenes" id="scenes"></div>
</div>

<script>
const D = /*__DATA__*/null;
const W = 1920, H = 1080, M = 120, TR = .7;
const C = { bg: "#07090a", bg2: "#121513", ink: "#f1f3ef", ink2: "#c3c5bc", muted: "#8d9189", rule: "#2b2e2a", chip: "#1f2320",
  blue: "#3987e5", blueSoft: "#17304f", orange: "#e0692f", red: "#e0524f", aqua: "#22b07d", violet: "#8e82e6", yellow: "#e8b339",
  english: "#4d6a8c", code: "#7a67b3", thai: "#2f8f69", locked: "#3a3d38", dim: "#1c201d" };
const FD = "'Bai Jamjuree', 'IBM Plex Sans Thai', sans-serif", FB = "'IBM Plex Sans Thai', sans-serif", FM = "'IBM Plex Mono', monospace";
const cv = document.getElementById("c"), ctx0 = cv.getContext("2d");
let ctx = ctx0;  // every helper draws on `ctx`; transitions point it at an offscreen buffer
const mk = (w = W, h = H) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const fmt = n => Math.round(n).toLocaleString("en-US");
const pct = (x, d = 0) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x * 100).toFixed(d) + "%";
const range = n => Array.from({ length: n }, (_, i) => i);
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = `${o.weight || 400} ${o.size || 32}px ${o.font || FB}`;
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowR || 24; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function tw(s, size, font = FB, weight = 400) { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
const segm = new Intl.Segmenter("th", { granularity: "grapheme" });
function wrapChars(s, x, y, maxW, o = {}) {
  const size = o.size || 32, lh = (o.lh || 1.4) * size; let line = "", yy = y;
  for (const { segment: g } of segm.segment(s)) { if (tw(line + g, size) > maxW && line) { text(line, x, yy, o); line = g.trimStart(); yy += lh; } else line += g; }
  if (line) text(line, x, yy, o);
  return yy + lh;
}
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function glow(color, blur, fn) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fn(); ctx.restore(); }
// visible space; a lone combining mark sits on a dotted circle so it can be seen
const SP = s => s.replace(/^~/, "").replace(/\s/g, "␣").replace(/^\p{M}/u, "◌$&") || "␣";
const chipW = (s, size) => Math.max(size * .7, tw(SP(s), size)) + size * .5;
function chipAt(s, x, y, w, size, o = {}) {
  const h = size * 1.45, part = s.startsWith("~");
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowR || 22; }
  rr(x, y, w, h, Math.min(8, size * .25), part ? "#3a2320" : (o.bg || C.chip), o.stroke); ctx.shadowBlur = 0;
  text(SP(s), x + w / 2, y + h * .72, { size, align: "center", color: part ? "#f0a39a" : (o.color || C.ink) });
  ctx.restore();
}
function chip(s, x, y, o = {}) { const size = o.size || 30, w = chipW(s, size); chipAt(s, x, y, w, size, o); return w; }
// chip layout with wrapping; each box remembers which characters it covers
function flowBoxes(list, x, y, maxW, size, gap = 6, lgap = 10) {
  const h = size * 1.45; let cx = x, cy = y, c = 0;
  return list.map(s => { const w = chipW(s, size); if (cx + w > x + maxW) { cx = x; cy += h + lgap; } const b = { s, x: cx, y: cy, w, a: c, b: c + s.length }; c += s.length; cx += w + gap; return b; });
}
function flow(list, x, y, maxW, o = {}) {
  const size = o.size || 30, boxes = flowBoxes(list, x, y, maxW, size, o.gap ?? 6, o.lgap ?? 10);
  boxes.forEach((b, i) => { const a = o.pop != null ? eo(clamp(o.pop - i)) : 1; if (a > 0) chipAt(b.s, b.x, b.y + (1 - a) * 14, b.w, size, { ...o, alpha: (o.alpha ?? 1) * a }); });
  return boxes.length ? boxes[boxes.length - 1].y + size * 1.45 + (o.lgap ?? 10) : y;
}
// morph one chip sequence into another (a merge step): each new chip grows out of the old ones it covers
function morph(A, B, p, draw) {
  B.forEach(bb => {
    const l = A.find(q => q.a === bb.a) || A[0], r = A.find(q => q.b === bb.b) || l;
    const same = l.y === r.y, x0 = l.x, w0 = same ? r.x + r.w - l.x : l.w, y0 = l.y;
    draw(bb, lerp(x0, bb.x, p), lerp(y0, bb.y, p), lerp(w0, bb.w, p), l !== r);
  });
}
function counter(v, x, y, o = {}) { text(fmt(v), x, y, { size: o.size || 96, font: FD, weight: 700, color: o.color || C.ink, align: o.align || "left", alpha: o.alpha, glow: o.glow, glowR: o.glowR }); }
function arrow(x1, y1, x2, y2, color = C.muted, p = 1, wdt = 4) {
  if (p <= 0) return;
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = wdt; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  if (p > .95) { const a = Math.atan2(y2 - y1, x2 - x1); ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - 18 * Math.cos(a - .45), y2 - 18 * Math.sin(a - .45)); ctx.lineTo(x2 - 18 * Math.cos(a + .45), y2 - 18 * Math.sin(a + .45)); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function line(x1, y1, x2, y2, color, wdt = 3, dash) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = wdt; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function heading(s, t, o = {}) {
  const a = eo(seg(t, .15, .8));
  text(s, o.x ?? M, (o.y ?? 150) + (1 - a) * 24, { size: o.size || 56, font: FD, weight: 600, alpha: a, align: o.align });
}
function hbar(x, y, w, h, color, p = 1) { if (w * p > .5) rr(x, y, Math.max(2, w * p), h, Math.min(6, h / 2), color); }
// a bright band that slides across text
function sweepText(s, x, y, o, p) {
  text(s, x, y, o);
  if (p <= 0 || p >= 1) return;
  const w = tw(s, o.size, o.font || FB, o.weight || 400), x0 = o.align === "center" ? x - w / 2 : x, c = x0 - 300 + (w + 600) * p;
  const g = ctx.createLinearGradient(c - 180, 0, c + 180, 0);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, "rgba(255,255,255,.9)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.save(); ctx.globalCompositeOperation = "lighter"; text(s, x, y, { ...o, color: g, glow: null }); ctx.restore();
}
// letters rise into place one by one
function riseText(s, x, y, o, t0, t) {
  const w = tw(s, o.size, o.font || FB, o.weight || 400); let cx = o.align === "center" ? x - w / 2 : x;
  [...s].forEach((ch, i) => {
    const a = eo(seg(t, t0 + i * .025, t0 + i * .025 + .55));
    if (a > 0) text(ch, cx, y + (1 - a) * 50, { ...o, align: "left", alpha: (o.alpha ?? 1) * a });
    cx += tw(ch, o.size, o.font || FB, o.weight || 400);
  });
}
function spot(x, y, r, color, a = .22) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace("A", a)); g.addColorStop(1, color.replace("A", 0));
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
const LIGHT = { warm: "rgba(232,179,57,A)", blue: "rgba(57,135,229,A)", white: "rgba(220,230,255,A)", red: "rgba(224,82,79,A)", green: "rgba(34,176,125,A)" };
function legendRow(items, x, y, size = 24) {
  let cx = x;
  for (const [label, color] of items) { rr(cx, y - size * .75, size * .8, size * .8, 4, color); text(label, cx + size * 1.1, y, { size, color: C.ink2 }); cx += size * 1.6 + tw(label, size) + 36; }
}
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;

/* ---------- static layers: background particles, vignette, film grain ---------- */
const BGP = (() => {
  const c = mk(2600, 1600), g = c.getContext("2d"), r = rnd(11), cs = "กขคงจฉชซญดตถทนบปผพฟภมยรลวศษสหอฮะาเแโใไ";
  g.fillStyle = "#e8ecf0";
  for (let i = 0; i < 90; i++) {
    const s = 18 + r() * 90, blur = s > 60 ? 6 : s > 36 ? 3 : 1.5;
    g.filter = `blur(${blur}px)`; g.globalAlpha = .025 + r() * .06; g.font = `400 ${s}px ${FB}`;
    g.fillText(cs[Math.floor(r() * cs.length)], r() * 2600, r() * 1600);
  }
  g.filter = "blur(1px)";
  for (let i = 0; i < 260; i++) { g.globalAlpha = .05 + r() * .12; g.beginPath(); g.arc(r() * 2600, r() * 1600, .6 + r() * 1.8, 0, 7); g.fill(); }
  return c;
});
let bgLayer = null;  // built after the fonts load
const VIG = (() => { const c = mk(), g = c.getContext("2d"), gr = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.72)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();
const GRAIN = (() => { const c = mk(256, 256), g = c.getContext("2d"), im = g.createImageData(256, 256), r = rnd(5); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; })();
function background(cam, T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  const g = ctx.createRadialGradient(W * .5, H * .42, 50, W * .5, H * .5, W * .75);
  g.addColorStop(0, "#131a17"); g.addColorStop(1, "#050606"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!bgLayer) return;
  // the far layer moves at a fraction of the camera: parallax
  const px = -(cam.x - W / 2) * .18 - T * 6, py = -(cam.y - H / 2) * .18, s = 1 + (cam.z - 1) * .15;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.rotate(cam.r * .4);
  ctx.drawImage(bgLayer, -1300 + (((px % 600) + 600) % 600 - 300), -800 + py); ctx.restore();
}
function overlays(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(VIG, 0, 0);
  const f = Math.round(T * 24), ox = (f * 73) % 256, oy = (f * 151) % 256;
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = "overlay"; ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(GRAIN, "repeat"); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

/* ---------- camera ---------- */
// keys: [t, x, y, zoom, roll]; the camera looks at (x, y) of the scene's 1920x1080 world
function keyAt(keys, t) {
  if (t <= keys[0][0]) return [keys[0], keys[0], 0];
  let i = 0; while (i < keys.length - 1 && t >= keys[i + 1][0]) i++;
  const A = keys[i], B = keys[Math.min(i + 1, keys.length - 1)];
  return [A, B, A === B ? 0 : eio(seg(t, A[0], B[0]))];
}
function camAt(keys, t) {
  if (!keys || !keys.length) return { x: W / 2, y: H / 2, z: 1, r: 0 };
  const [A, B, p] = keyAt(keys, t);
  return { x: lerp(A[1], B[1], p), y: lerp(A[2], B[2], p), z: lerp(A[3], B[3], p), r: lerp(A[4] || 0, B[4] || 0, p) };
}
function lightAt(keys, t) {
  if (!keys || !keys.length) return null;
  const [A, B, p] = keyAt(keys, t);
  return [lerp(A[1], B[1], p), lerp(A[2], B[2], p), lerp(A[3], B[3], p), p < .5 ? A[4] : B[4]];
}
function applyCam(c, T) {
  // a slow, small drift keeps the frame alive, like a camera on a slider
  const dx = Math.sin(T * .31) * 5 + Math.sin(T * .17) * 4, dy = Math.cos(T * .23) * 4;
  ctx.translate(W / 2, H / 2); ctx.scale(c.z, c.z); ctx.rotate(c.r); ctx.translate(-c.x - dx, -c.y - dy);
}

/* ---------- vocabulary grid (tilted plane) ---------- */
const CAT = D.vocab.cells, NV = CAT.length;
const CATCOLOR = { "0": C.english, "1": C.code, "2": C.thai, "3": C.locked, "4": C.dim };
const G = { cols: 200, cw: 7, ch: 4.4, x: 450, y: 290, shear: -.45, squash: .55 };
const cellXY = i => { const c = i % G.cols, r = Math.floor(i / G.cols), x = c * G.cw, y = r * G.ch; return [G.x + x + G.shear * y, G.y + G.squash * y]; };
function gridPlane(fill) {
  ctx.save(); ctx.translate(G.x, G.y); ctx.transform(1, 0, G.shear, G.squash, 0, 0);
  let last = null;
  for (let i = 0; i < NV; i++) {
    const col = fill(i, CAT[i]); if (!col) continue;
    if (col !== last) { ctx.fillStyle = col; last = col; }
    ctx.fillRect((i % G.cols) * G.cw, Math.floor(i / G.cols) * G.ch, G.cw - 1.4, G.ch - 1.1);
  }
  ctx.restore();
}
function gridBeam(col, color) {
  ctx.save(); ctx.translate(G.x, G.y); ctx.transform(1, 0, G.shear, G.squash, 0, 0);
  const x = col * G.cw, g = ctx.createLinearGradient(x - 90, 0, x + 12, 0);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, color);
  ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - 90, -20, 102, (NV / G.cols) * G.ch + 40);
  ctx.restore();
}
const FREED = []; for (let i = 0; i < NV; i++) if (CAT[i] === "4") FREED.push(i);
const FILL_RANK = new Map(D.added_ids.map((id, k) => [id, k]));

/* ---------- data shortcuts ---------- */
const S = D.sentence;
const DOM = [["wikipedia", "Wikipedia"], ["news", "News"], ["social", "Social"]];

/* ---------- scenes ---------- */
const ACTS = ["Intro", "Step 1 · Learn", "Step 2 · Read", "Step 3 · Find room", "Step 4 · Safe to remove", "Step 5 · Fill", "Step 6 · Protect English", "Step 7 · Teach the model", "Result"];
const SC = [];
// {act, title, dur, cap, draw(t), cam: keys | camFn(t), light: keys, trans}
const scene = o => SC.push(o);
const card = (act, n, title, sub) => scene({ act, title: `Step ${n}: ${title}`, dur: 3.2, trans: "zoom", card: true,
  cam: [[0, W / 2, H / 2, .96], [3.2, W / 2, H / 2, 1.06]], light: [[0, W / 2 - 300, H / 2, 900, "blue"], [3.2, W / 2 + 300, H / 2, 900, "blue"]],
  draw: t => {
    ctx.save(); ctx.globalAlpha = .07 + .05 * seg(t, 0, 1); ctx.font = `700 620px ${FD}`; ctx.textAlign = "right"; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.strokeText(String(n).padStart(2, "0"), W - 40 + (1 - eo(seg(t, 0, 1.2))) * 120, 820); ctx.restore();
    text(`STEP ${n} OF 7`, M + 40, 430, { size: 28, font: FM, weight: 600, color: C.yellow, alpha: eo(seg(t, .15, .6)), glow: "rgba(232,179,57,.6)", glowR: 18 });
    riseText(title, M + 40, 560, { size: 104, font: FD, weight: 700 }, .3, t);
    line(M + 40, 610, M + 40 + 900 * eo(seg(t, .8, 1.8)), 610, C.blue, 4);
    text(sub, M + 40, 680, { size: 34, color: C.ink2, alpha: eo(seg(t, 1, 1.7)) });
    if (t > 1.2) sweepText(title, M + 40, 560, { size: 104, font: FD, weight: 700, color: "rgba(0,0,0,0)" }, seg(t, 1.3, 2.6));
  } });

/* Intro */
scene({ act: 0, title: "The same sentence, twice", dur: 15, trans: "fade",
  cap: "Tokens are the pieces a model reads and pays for. The same news sentence costs Mistral-7B 34 tokens in English and 89 in Thai.",
  cam: [[0, W / 2, 300, 1.28], [3.6, W / 2, 300, 1.22], [5.2, W / 2, 520, 1.12], [9.5, W / 2, 580, 1.02], [15, W / 2, 570, .97]],
  light: [[0, W / 2, 280, 800, "white"], [4.5, W / 2, 520, 800, "warm"], [9.8, 700, 800, 700, "warm"]],
  draw: t => {
    text("ENGLISH", M, 215, { size: 22, font: FM, weight: 600, color: C.muted, alpha: seg(t, .3, .8) });
    flow(S.en_pieces, M, 235, 1680, { size: 30, pop: seg(t, .6, 3.2) * S.en_pieces.length });
    text("THAI · SAME MEANING", M, 430, { size: 22, font: FM, weight: 600, color: C.orange, alpha: seg(t, 4, 4.5) });

card(2, 2, "How it reads text", "A pattern cuts the text, then the merges run inside each piece.");
function traceLayout(s, cx, y, fsz, gap = 12) {
  const ws = s.map(x => chipW(x, fsz)), tot = ws.reduce((a, b) => a + b, 0) + gap * (s.length - 1);
  let x = cx - tot / 2, c = 0;
  return s.map((x2, i) => { const r = { s: x2, x, y, w: ws[i], a: c, b: c + x2.length }; c += x2.length; x += ws[i] + gap; return r; });
}
// one row of chips mid-merge: state k -> k+1 at progress p, centred on cx; returns the live count and the merge point
function traceRow(st, k, p, cx, y, fsz, o = {}) {
  const nxt = k < st.length - 1 && (p > 0 || k > 0) ? k + 1 : k;
  const A = traceLayout(st[k], cx, y, fsz), B = traceLayout(st[nxt], cx, y, fsz);
  let mid = cx;
  morph(A, B, p, (bb, x, yy, w, merged) => {
    chipAt(bb.s, x, y, w, fsz, { alpha: o.alpha, bg: o.done || (merged && p < 1) ? C.blueSoft : C.chip, stroke: o.done || merged ? C.blue : null, glow: merged && p < 1 && !o.done ? "rgba(57,135,229,.8)" : null });
    if (merged) mid = x + w / 2;
  });
  return { n: st[nxt].length + (st[k].length - st[nxt].length) * (1 - p), mid };
}

const mergeProg = t => { const prog = seg(t, 1, 11) * MSTEPS, k = Math.min(Math.floor(prog), MSTEPS - 1); return [k, eio(clamp(prog - k))]; };

  return mid;
}

}
