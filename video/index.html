  "Three real sentences": () => D.payoff.flatMap((P, i) => { const t0 = .6 + i * 4.6; return [...spread(t0, t0 + 1.4, P.mistral.length).map(t => [t, "tick", 2]), [t0 + 1.8, "whoosh", 1], [t0 + 2.2, "fall2"], [t0 + 2.8, "ding", i]]; }),
  "The catch": () => range(5).map(i => [.8 + i * .5, "bar", 6 - i]),
  "Faster Thai answers": () => [D.stream.answers.control, D.stream.answers.retrofit].flatMap((a, c) => { const rate = a.tokens / a.seconds, out = []; for (let m = 0; m < a.tokens && m / rate <= 25; m++) out.push([.8 + (m / rate) / 25 * 8.7, "type", c]); return out; }),
  "Try it": () => [[.1, "swell"], [.9, "chord", 2], [1.4, "sparkle"], [3, "ding", 1]],
};
const CARD_CUES = () => [[.05, "impact", 0], [.4, "whoosh", 1], [1.4, "sparkle"]];
window.__cues = SC.flatMap((s, i) => [...(i && !s.card ? [[s.start - .1, "trans", i % 4]] : []),
  ...(s.card ? CARD_CUES() : CUE[s.title] ? CUE[s.title]() : []).map(([t, k, v]) => [s.start + t, k, v ?? 0])]);
window.__acts = SC.map(s => [s.start, s.act]);
window.__TOTAL = TOTAL; window.__render = render; window.__scenes = SC.map(s => ({ title: s.title, start: s.start, dur: s.dur }));

/* ---------- player ---------- */
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), time = document.getElementById("time");
const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}`;
let T = 0, playing = false, last = 0;
const box = document.getElementById("scenes");
let curAct = -1;
SC.forEach(s => {
  if (s.act !== curAct) { curAct = s.act; const d = document.createElement("div"); d.className = "act"; d.textContent = ACTS[s.act]; box.append(d); }
  const b = document.createElement("button"); b.type = "button"; b.textContent = s.card ? "Title card" : s.title; b.onclick = () => { T = s.start + .01; draw(); sndSync(true); }; s.btn = b; box.append(b);
});
function draw() {
  const s = render(T);
  scrub.value = String(Math.round(T / TOTAL * 1000)); time.textContent = `${mmss(T)} / ${mmss(TOTAL)}`;
  SC.forEach(x => x.btn.classList.toggle("on", x === s));
}
// soundtrack: while playing, the audio is the clock; seek only on user actions
const snd = document.getElementById("snd"), muteBtn = document.getElementById("mute");
const sndOk = () => snd.readyState >= 1 && !snd.error;
let following = false;
function sndSync(force) {
  if (!sndOk()) return;
  if (!playing) { snd.pause(); return; }
  if (force) { snd.currentTime = T; following = false; }
  if (snd.paused) snd.play().catch(() => {});
}
const sndClock = () => sndOk() && !snd.paused && !snd.seeking && snd.readyState >= 3;
muteBtn.onclick = () => { snd.muted = !snd.muted; muteBtn.textContent = snd.muted ? "Sound off" : "Sound on"; muteBtn.setAttribute("aria-pressed", String(snd.muted)); };
function loop(now) {
  if (!playing) return;
  if (sndClock()) {
    // audio started late: bring it to the animation once, then follow it
    if (!following) { following = true; if (Math.abs(snd.currentTime - T) > .25) snd.currentTime = T; }
    else T = snd.currentTime;
  } else T += (now - last) / 1000;
  last = now;
  if (T >= TOTAL) { T = TOTAL - .01; playing = false; playBtn.textContent = "Replay"; sndSync(); }
  draw(); if (playing) requestAnimationFrame(loop);
}
playBtn.onclick = () => { if (playing) { playing = false; playBtn.textContent = "Play"; sndSync(); return; } if (T >= TOTAL - .05) T = 0; playing = true; playBtn.textContent = "Pause"; last = performance.now(); sndSync(true); requestAnimationFrame(loop); };
scrub.oninput = () => { T = +scrub.value / 1000 * TOTAL; draw(); sndSync(true); };
// full screen: the stage only; click it to play/pause, F or double-click to toggle
const stage = document.querySelector(".stage"), fullBtn = document.getElementById("full");
const toggleFull = () => { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen?.().catch(() => {}); };
fullBtn.onclick = toggleFull;
if (!document.fullscreenEnabled) fullBtn.hidden = true;
cv.addEventListener("click", () => { if (document.fullscreenElement) playBtn.click(); });
cv.addEventListener("dblclick", toggleFull);
document.addEventListener("fullscreenchange", () => { fullBtn.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === " " && (e.target === document.body || document.fullscreenElement)) { e.preventDefault(); playBtn.click(); }
  else if (e.key === "f" || e.key === "F") toggleFull();
});
const fontsReady = Promise.all([`600 60px ${FD}`, `400 32px ${FB}`, `500 22px ${FM}`, `700 96px ${FD}`, `400 40px ${FB}`].map(f => document.fonts.load(f, "ภาษา Aa"))).catch(() => {});
window.__ready = fontsReady.then(() => { bgLayer = BGP(); T = 9; draw(); T = 0; });
</script>
